
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balinesia AI - Asisten Budaya & Pariwisata Bali</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 flex flex-col h-screen justify-between">
    <!-- Header -->
    <header class="bg-emerald-800 text-white p-4 text-center shadow-md">
        <h1 class="text-xl font-bold">Balinesia AI 🌴</h1>
        <p class="text-sm text-emerald-200">Asisten Pintar Budaya & Pariwisata Bali</p>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 max-w-[80%] text-slate-700">
                Halo! Saya Balinesia AI. Ada yang ingin kamu tanyakan seputar adat istiadat, etika pura, atau pariwisata di Bali?
            </div>
        </div>
    </main>

    <!-- Input Form -->
    <footer class="bg-white border-t border-slate-200 p-4">
        <form id="chat-form" class="max-w-2xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="Tanyakan sesuatu tentang Bali..." required
                class="flex-1 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600">
            <button type="submit" class="bg-emerald-800 text-white px-6 py-2 rounded-lg font-medium hover:bg-emerald-900 transition">
                Kirim
            </button>
        </form>
    </footer>

    <!-- Script Sederhana untuk Menghubungkan ke API AI -->
    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const container = document.getElementById('chat-container');

        // Ganti dengan API Key Gemini milikmu nanti
        const API_KEY = "MASUKKAN_API_KEY_KAMU_DI_SINI";

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            // Tampilkan pesan user
            container.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-emerald-800 text-white p-3 rounded-2xl max-w-[80%]">${text}</div>
                </div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Tampilkan loading sebentar
            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-slate-200 text-slate-600 p-3 rounded-2xl text-sm animate-pulse">Sedang berpikir...</div>
                </div>`;
            container.scrollTop = container.scrollHeight;

            try {
                // Panggil Google Gemini API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "Bertindaklah sebagai asisten ahli budaya dan pariwisata Bali bernama Balinesia AI. Jawablah pertanyaan berikut dengan informatif, sopan, dan akurat: " + text }]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf, terjadi kesalahan saat memproses jawaban.";

                // Tampilkan balasan AI
                container.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 max-w-[80%] text-slate-700">${reply}</div>
                    </div>`;
            } catch (err) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-red-100 text-red-600 p-3 rounded-2xl">Gagal terhubung ke server AI.</div>
                    </div>`;
            }
            container.scrollTop = container.scrollHeight;
        });
    </script>
</body>
</html>
