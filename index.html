<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balinesia AI - Asisten Pintar Budaya & Pariwisata Bali</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 flex flex-col h-screen font-sans">

    <!-- Header -->
    <header class="bg-emerald-800 text-white p-4 text-center shadow-md">
        <h1 class="text-xl font-bold">Balinesia AI</h1>
        <p class="text-sm text-emerald-200">Asisten Pintar Budaya & Pariwisata Bali</p>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl mx-auto w-full">
        <!-- Pesan Sambutan dari AI -->
        <div class="flex justify-start">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 max-w-xs sm:max-w-md text-slate-800">
                Halo! Saya Balinesia AI. Ada yang ingin kamu tanyakan seputar destinasi wisata, tradisi, atau kuliner khas Bali? 🌴
            </div>
        </div>
    </main>

    <!-- Input Form -->
    <footer class="bg-white p-4 border-t border-slate-200">
        <form id="chat-form" class="max-w-2xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Tanyakan sesuatu tentang Bali..." 
                required 
                class="flex-1 border border-slate-300 rounded-xl px-4 py-2 focus:outline-none focus:border-emerald-600 text-slate-800"
            />
            <button 
                type="submit" 
                class="bg-emerald-700 hover:bg-emerald-800 text-white px-5 py-2 rounded-xl font-medium transition"
            >
                Kirim
            </button>
        </form>
    </footer>

    <!-- Logic JavaScript -->
    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');

        // Pengetahuan Sederhana Balinesia AI
        function getAIResponse(query) {
            const text = query.toLowerCase();
            if (text.includes('pantai') || text.includes('wisata')) {
                return "Rekomendasi pantai populer di Bali antara lain Pantai Kuta, Pantai Pandawa, dan Pantai Uluwatu yang cocok untuk menikmati *sunset*!";
            } else if (text.includes('makanan') || text.includes('kuliner') || text.includes('makan')) {
                return "Kuliner khas Bali yang terkenal ada Ayam Betutu, Babi Guling, Sate Lilit, dan Nasi Campur Bali!";
            } else if (text.includes('budaya') || text.includes('tari') || text.includes('upacara')) {
                return "Bali kaya akan budaya seperti Tari Kecak, Tari Barong, serta tradisi upacara Ngaben dan Hari Raya Nyepi.";
            } else {
                return `Terima kasih pertanyaannya tentang "${query}"! Balinesia AI siap membantu kamu menjelajahi indahnya pulau Bali.`;
            }
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Tampilkan Pesan User
            const userBubble = `
                <div class="flex justify-end">
                    <div class="bg-emerald-700 text-white p-3 rounded-2xl shadow-sm max-w-xs sm:max-w-md">
                        ${message}
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', userBubble);
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Respon AI
            setTimeout(() => {
                const aiReply = getAIResponse(message);
                const aiBubble = `
                    <div class="flex justify-start">
                        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 max-w-xs sm:max-w-md text-slate-800">
                            ${aiReply}
                        </div>
                    </div>
                `;
                chatContainer.insertAdjacentHTML('beforeend', aiBubble);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 600);
        });
    </script>
</body>
</html>
